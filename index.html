.actions li{margin:8px 0;line-height:1.55}.hide{display:none}.progress{height:7px;background:#eadfce;border-radius:10px;overflow:hidden;margin-bottom:18px}.progress div{height:100%;background:var(--red)}

<body><main class="wrap">
<section id="start" class="card hero">

</section>

</section>

 </div>

</section>
</main>

let scores={see:0,hear:0,speak:0}, route=null, questions=[], qi=0, uname="";
function begin(){
 uname=document.getElementById("name").value.trim();
 document.getElementById("start").classList.add("hide");
 document.getElementById("quiz").classList.remove("hide");
 questions=[...common,{routePick:true}]; qi=0; renderQ();
}
function renderQ(){
 let q=questions[qi];
 document.getElementById("bar").style.width=((qi)/(questions.length||1)*100)+"%";
 document.getElementById("qno").textContent="Q"+(qi+1);
 if(q.routePick){
  document.getElementById("qtext").textContent="で、何がいちばん引っかかってる？";
  let o=document.getElementById("options"); o.innerHTML="";
  Object.entries(routes).forEach(([k,v])=>{let b=document.createElement("button");b.className="option";b.textContent=v.label;b.onclick=()=>pickRoute(k);o.appendChild(b)});
  return;
 }
 document.getElementById("qtext").textContent=q[0];
 let o=document.getElementById("options");o.innerHTML="";
 q[1].forEach(([txt,pts])=>{let b=document.createElement("button");b.className="option";b.textContent=txt;b.onclick=()=>answer(pts);o.appendChild(b)});
}
function answer(pts){Object.entries(pts).forEach(([k,v])=>scores[k]+=v);qi++; if(qi<questions.length)renderQ();else finish()}
function pickRoute(k){route=k;questions=[...common,{routePick:true},...routes[k].qs];qi++;renderQ()}
function finish(){
 document.getElementById("quiz").classList.add("hide");document.getElementById("result").classList.remove("hide");
 const vals=Object.values(scores), max=Math.max(...vals), min=Math.min(...vals);
 const complete=min>=2;
 let type=complete?"all":Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0];
 let data;
 if(complete){
  data=["🐒🐒🐒 三猿コンプリート","おめでとうございます。全部です🤣","見てへん・聞いてへん・言うてへんが同時発生中。新しいことを足す前に、今ある商売を一回整理する方が先。","新しいことを始める。",["今ある商品・発信・数字を全部確認","お客さん1人の声を聞く","今週売るものを1つだけ案内"],"新しいこと始めるの禁止。まず今あるもん確認しよか🤣"];
 } else data=resultCopy[route][type];
 const prefix=uname?uname+"、":"";
 document.getElementById("typeBadge").textContent=data[0];
 document.getElementById("sermon").textContent=prefix+data[1];
 document.getElementById("reason").textContent=data[2];
 document.getElementById("dont").textContent=data[3];
 document.getElementById("actions").innerHTML=data[4].map(x=>"<li>"+x+"</li>").join("");

/* 外部ライブラリなしで結果カードをPNG化。
   DOMをSVG foreignObjectに包み、同一オリジンの画像をdataURL化してからcanvasへ描画する。 */
async function saveCard(){
 const card=document.getElementById("shareCard");
 try{
  const clone=card.cloneNode(true);
  const originalImgs=[...card.querySelectorAll("img")], cloneImgs=[...clone.querySelectorAll("img")];
  for(let i=0;i<originalImgs.length;i++){
   const r=await fetch(originalImgs[i].src); const blob=await r.blob();
   const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});
   cloneImgs[i].src=data;
  }
  const width=640;
  const temp=document.createElement("div"); temp.style.cssText=`position:fixed;left:-9999px;top:0;width:${width}px`; temp.appendChild(clone);document.body.appendChild(temp);
  const height=Math.ceil(clone.getBoundingClientRect().height)+10;
  const css=document.querySelector("style").textContent;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}#shareCard{width:${width-20}px;margin:0;background:#fffaf0}</style>${clone.outerHTML}</div></foreignObject></svg>`;
  temp.remove();
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
  const img=new Image(); img.onload=()=>{
   const c=document.createElement("canvas");c.width=width*2;c.height=height*2;const ctx=c.getContext("2d");ctx.scale(2,2);ctx.fillStyle="#fffaf0";ctx.fillRect(0,0,width,height);ctx.drawImage(img,0,0);
   URL.revokeObjectURL(url);c.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="umeko-consult-result.PNG";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"image/png");
  }; img.onerror=()=>{URL.revokeObjectURL(url);alert("画像保存に失敗しました。スクリーンショットで保存してな🐒")}; img.src=url;
 }catch(e){alert("画像保存に失敗しました。スクリーンショットで保存してな🐒")}
}
</script></body></html>
